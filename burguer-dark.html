<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE BURGER BOSS | Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; /* Fundo escuro fora do app */
            color: #f8fafc; 
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        
        /* CONTAINER PRINCIPAL - TIPO APP */
        #app-container {
            width: 100%;
            max-width: 450px; /* Limita a largura para parecer celular */
            background-color: #020617;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-home { 
            background-image: linear-gradient(to bottom, rgba(2, 6, 23, 0.8), rgba(2, 6, 23, 1)), 
                              url('https://images.unsplash.com/photo-1550547660-d9450f859349?w=600'); 
            background-size: cover; 
            background-position: center; 
        }
        
        .glass { 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
        
        .category-pill.active { background-color: #fbbf24; color: #000; }
        .section { display: none; padding-bottom: 100px; } /* Espaço extra no final */
        .section.active { display: block; }
        .flex-section.active { display: flex; flex-direction: column; }
        
        .input-boss { 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 8px; 
            padding: 10px; 
            width: 100%; 
            color: white; 
            outline: none; 
            font-size: 13px;
        }
        .input-boss:focus { border-color: #fbbf24; background: rgba(15, 23, 42, 0.9); }
        
        /* Scrollbar escondida */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body>

<div id="app-container">

    <section id="home-screen" class="section flex-section active bg-home p-6 justify-center items-center text-center h-screen">
        <div class="animate-fade space-y-5">
            <div class="relative inline-block">
                <div class="absolute inset-0 bg-yellow-500 blur-2xl opacity-20 rounded-full"></div>
                <img src="https://images.unsplash.com/photo-1561758033-d89a9ad46330?w=300" class="w-28 h-28 rounded-full border-4 border-yellow-500 mx-auto object-cover relative z-10 shadow-xl">
            </div>
            <div>
                <h1 class="text-3xl font-black italic tracking-tighter">BURGER <span class="text-yellow-500">BOSS</span></h1>
                <p class="text-slate-400 text-xs mt-2 uppercase tracking-widest">Premium Delivery</p>
            </div>
            <button onclick="showSection('catalog-screen')" class="w-full max-w-[200px] bg-yellow-500 text-black font-black py-3.5 rounded-xl shadow-lg hover:scale-105 transition-transform uppercase text-sm tracking-wider">
                Fazer Pedido
            </button>
        </div>
    </section>

    <nav id="top-nav" class="fixed top-0 w-full max-w-[450px] z-50 glass px-4 py-3 flex justify-between items-center hidden">
        <button onclick="goBack()" class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center hover:bg-white/10 transition"><i class="fas fa-chevron-left text-xs"></i></button>
        <span class="font-bold italic text-sm">BURGER <span class="text-yellow-500">BOSS</span></span>
        <div class="relative" onclick="showSection('cart-screen')">
            <i class="fas fa-shopping-bag text-lg"></i>
            <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-600 text-[9px] w-3.5 h-3.5 rounded-full flex items-center justify-center font-bold">0</span>
        </div>
    </nav>

    <main id="catalog-screen" class="section pt-16 px-4">
        <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar sticky top-[55px] z-40 bg-[#020617]/95 py-2 backdrop-blur-sm">
            <button onclick="filterCategory('Todos')" class="category-pill active px-4 py-1.5 rounded-full glass text-[11px] font-bold transition-colors whitespace-nowrap">Todos</button>
            <button onclick="filterCategory('Burgers')" class="category-pill px-4 py-1.5 rounded-full glass text-[11px] font-bold transition-colors whitespace-nowrap">Burgers</button>
            <button onclick="filterCategory('Combos')" class="category-pill px-4 py-1.5 rounded-full glass text-[11px] font-bold transition-colors whitespace-nowrap">Combos</button>
            <button onclick="filterCategory('Bebidas')" class="category-pill px-4 py-1.5 rounded-full glass text-[11px] font-bold transition-colors whitespace-nowrap">Bebidas</button>
        </div>
        
        <div id="menu-container" class="space-y-3 mt-2"></div>
    </main>

    <section id="cart-screen" class="section pt-16 px-4">
        <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fas fa-list-ul text-yellow-500"></i> Resumo do Pedido</h2>
        
        <div id="cart-items-container" class="space-y-3"></div>
        
        <div id="cart-footer" class="hidden mt-6 animate-fade">
            <div class="glass p-3 rounded-xl mb-4">
                <label class="text-[10px] text-yellow-500 font-bold uppercase mb-1 block"><i class="fas fa-utensils mr-1"></i> Observações da Cozinha</label>
                <textarea id="order-obs" rows="2" placeholder="Ex: Sem cebola, maionese à parte, bem passado..." class="input-boss resize-none border-none bg-black/20 text-sm"></textarea>
            </div>

            <div class="glass p-4 rounded-xl">
                <div class="flex justify-between text-lg font-bold text-white mb-4">
                    <span>Total:</span>
                    <span id="total-val" class="text-yellow-500">R$ 0,00</span>
                </div>
                <button onclick="showSection('address-screen')" class="w-full bg-green-600 hover:bg-green-500 text-white py-3.5 rounded-xl font-bold transition-colors text-sm uppercase tracking-wide">
                    Continuar para Endereço
                </button>
            </div>
        </div>
    </section>

    <section id="address-screen" class="section pt-16 px-4">
        <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fas fa-map-marker-alt text-yellow-500"></i> Entrega</h2>
        
        <div class="space-y-3 glass p-4 rounded-xl animate-fade">
            
            <div>
                <label class="text-[10px] text-slate-400 font-bold uppercase ml-1">Seu Nome</label>
                <input type="text" id="cust-name" class="input-boss" placeholder="Nome completo">
            </div>

            <div class="grid grid-cols-4 gap-2">
                <div class="col-span-3">
                    <label class="text-[10px] text-slate-400 font-bold uppercase ml-1">Rua</label>
                    <input type="text" id="cust-street" class="input-boss" placeholder="Nome da rua">
                </div>
                <div class="col-span-1">
                    <label class="text-[10px] text-slate-400 font-bold uppercase ml-1">Nº</label>
                    <input type="number" id="cust-number" class="input-boss text-center" placeholder="123">
                </div>
            </div>
            
            <div>
                <label class="text-[10px] text-slate-400 font-bold uppercase ml-1">Bairro</label>
                <input type="text" id="cust-district" class="input-boss" placeholder="Bairro">
            </div>

            <div>
                <label class="text-[10px] text-yellow-500 font-bold uppercase ml-1"><i class="fas fa-motorcycle mr-1"></i> Obs. de Entrega</label>
                <input type="text" id="cust-ref" class="input-boss" placeholder="Ex: Campainha quebrada, portão preto...">
            </div>
            
            <div class="h-px bg-white/10 my-2"></div>
            
            <div>
                <label class="text-[10px] text-slate-400 font-bold uppercase ml-1">Pagamento</label>
                <select id="cust-payment" class="input-boss appearance-none">
                    <option value="" disabled selected>Escolha a forma...</option>
                    <option value="Pix">Pix (Chave ou QR Code)</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
            </div>
            
            <div id="troco-area" class="hidden animate-fade mt-2">
                <label class="text-[10px] text-green-400 font-bold uppercase ml-1">Troco para quanto?</label>
                <input type="text" id="cust-troco" placeholder="R$ 50,00" class="input-boss border-green-500/30">
            </div>

            <button onclick="finishOrder()" class="w-full bg-green-600 hover:bg-green-500 text-white py-3.5 rounded-xl font-black mt-4 flex items-center justify-center gap-2 shadow-lg shadow-green-900/20 text-sm uppercase">
                <i class="fab fa-whatsapp text-lg"></i> Enviar Pedido
            </button>
        </div>
    </section>

    <div id="bottom-bar" class="fixed bottom-4 left-4 right-4 max-w-[420px] mx-auto glass p-3 rounded-xl z-50 flex justify-between items-center hidden animate-fade shadow-2xl border-t border-yellow-500/20">
        <div class="flex items-center gap-3">
            <div class="bg-yellow-500 text-black w-8 h-8 rounded-lg flex items-center justify-center font-bold text-xs" id="float-qty">0</div>
            <div>
                <p class="text-[10px] text-slate-400 uppercase font-bold">Total</p>
                <p id="floating-total" class="text-sm font-bold text-white">R$ 0,00</p>
            </div>
        </div>
        <button onclick="showSection('cart-screen')" class="bg-white text-black px-4 py-2 rounded-lg font-bold text-xs uppercase hover:bg-gray-200 transition">
            Ver Carrinho
        </button>
    </div>

</div>

<script>
    // --- DADOS DOS PRODUTOS ---
    const products = [
        { id: 1, name: "Boss Classic", price: 28.90, category: "Burgers", desc: "Pão brioche, 180g blend wagyu, queijo cheddar inglês e maionese defumada.", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=200" },
        { id: 2, name: "Cheddar Bacon", price: 34.90, category: "Burgers", desc: "Pão australiano, 180g carne, farofa de bacon crocante e muito creme de cheddar.", img: "https://images.unsplash.com/photo-1553979459-d2229ba7433b?w=200" },
        { id: 3, name: "Boss Duplo", price: 42.00, category: "Burgers", desc: "Pão brioche, 2x smash burgers 100g, dobro de queijo prato e picles artesanal.", img: "https://images.unsplash.com/photo-1525164286253-04e68b9d94bb?w=200" },
        { id: 4, name: "Combo Boss", price: 54.90, category: "Combos", desc: "1 Boss Classic + 1 Batata Frita M + 1 Refri Lata.", img: "https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?w=200" },
        { id: 5, name: "Combo Duplo", price: 68.00, category: "Combos", desc: "1 Cheddar Bacon + 1 Batata Frita G com Cheddar + 1 Refri 600ml.", img: "https://images.unsplash.com/photo-1534790561517-40e9017ef048?w=200" },
        { id: 7, name: "Coca-Cola Lata", price: 6.00, category: "Bebidas", desc: "Lata 350ml gelada.", img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=200" },
        { id: 9, name: "Cerveja Heineken", price: 12.00, category: "Bebidas", desc: "Long Neck 330ml.", img: "https://images.unsplash.com/photo-1618885472179-5e474019f2a9?w=200" }
    ];

    let cart = [];

    // --- NAVEGAÇÃO ---
    function showSection(id) {
        // Esconde todas as seções
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        // Mostra a seção desejada
        document.getElementById(id).classList.add('active');
        
        // Controle da Navbar
        const nav = document.getElementById('top-nav');
        if (id === 'home-screen') nav.classList.add('hidden');
        else nav.classList.remove('hidden');

        // Scroll para o topo
        window.scrollTo(0,0);

        if(id === 'catalog-screen') renderCatalog();
        if(id === 'cart-screen') renderCart();
        updateUI();
    }

    function goBack() {
        const active = document.querySelector('.section.active').id;
        if(active === 'address-screen') showSection('cart-screen');
        else if(active === 'cart-screen') showSection('catalog-screen');
        else showSection('home-screen');
    }

    // --- CATÁLOGO ---
    function renderCatalog(filter = 'Todos') {
        const container = document.getElementById('menu-container');
        const filtered = filter === 'Todos' ? products : products.filter(p => p.category === filter);
        
        container.innerHTML = filtered.map(p => `
            <div class="glass rounded-xl p-3 flex gap-3 items-center animate-fade hover:bg-white/5 transition-colors">
                <img src="${p.img}" class="w-16 h-16 rounded-lg object-cover shadow-sm bg-slate-800">
                <div class="flex-1 min-w-0">
                    <h3 class="font-bold text-sm text-slate-100 leading-tight">${p.name}</h3>
                    <p class="text-[10px] text-slate-400 leading-tight my-1 h-8 overflow-hidden line-clamp-2">${p.desc}</p>
                    <div class="flex justify-between items-center mt-1">
                        <span class="text-yellow-500 font-extrabold text-sm">R$ ${p.price.toFixed(2)}</span>
                        <button onclick="addToCart(${p.id})" class="bg-yellow-500 text-black w-7 h-7 rounded-lg flex items-center justify-center active:scale-90 transition-transform shadow-lg shadow-yellow-500/20">
                            <i class="fas fa-plus text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function filterCategory(cat) {
        document.querySelectorAll('.category-pill').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderCatalog(cat);
    }

    // --- CARRINHO ---
    function addToCart(id) {
        const product = products.find(p => p.id === id);
        const existing = cart.find(item => item.id === id);
        if(existing) existing.qty++;
        else cart.push({...product, qty: 1});
        
        // Feedback visual
        const btn = event.currentTarget;
        const originalContent = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check"></i>';
        btn.classList.add('bg-green-500', 'text-white');
        setTimeout(() => {
            btn.innerHTML = originalContent;
            btn.classList.remove('bg-green-500', 'text-white');
        }, 500);

        updateUI();
    }

    function updateUI() {
        const count = cart.reduce((sum, i) => sum + i.qty, 0);
        const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
        
        document.getElementById('cart-badge').innerText = count;
        document.getElementById('float-qty').innerText = count;
        document.getElementById('floating-total').innerText = `R$ ${total.toFixed(2)}`;
        
        const bar = document.getElementById('bottom-bar');
        if(count > 0 && document.getElementById('catalog-screen').classList.contains('active')) {
            bar.classList.remove('hidden');
            bar.classList.add('flex');
        } else {
            bar.classList.add('hidden');
            bar.classList.remove('flex');
        }
    }

    function renderCart() {
        const container = document.getElementById('cart-items-container');
        const footer = document.getElementById('cart-footer');
        
        if(cart.length === 0) {
            container.innerHTML = `
                <div class="text-center text-slate-500 mt-10 py-10 opacity-50">
                    <i class="fas fa-hamburger text-5xl mb-3 block"></i>
                    <p class="text-sm">Seu carrinho está vazio.</p>
                </div>`;
            footer.classList.add('hidden');
            return;
        }
        footer.classList.remove('hidden');
        container.innerHTML = cart.map((item, idx) => `
            <div class="glass p-3 rounded-xl flex justify-between items-center animate-fade border-l-[3px] border-yellow-500 relative overflow-hidden">
                <div class="flex-1 min-w-0 pr-2">
                    <p class="font-bold text-xs truncate text-white">${item.name}</p>
                    <p class="text-[9px] text-slate-400 truncate">${item.desc}</p>
                    <p class="text-yellow-500 text-xs font-bold mt-0.5">R$ ${(item.price * item.qty).toFixed(2)}</p>
                </div>
                <div class="flex items-center gap-3 bg-black/30 px-2 py-1.5 rounded-lg border border-white/5">
                    <button onclick="changeQty(${idx}, -1)" class="text-red-400 w-5 text-center hover:text-red-300"><i class="fas fa-minus text-[10px]"></i></button>
                    <span class="text-xs font-bold w-4 text-center select-none">${item.qty}</span>
                    <button onclick="changeQty(${idx}, 1)" class="text-green-400 w-5 text-center hover:text-green-300"><i class="fas fa-plus text-[10px]"></i></button>
                </div>
            </div>
        `).join('');
        
        const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
        document.getElementById('total-val').innerText = `R$ ${total.toFixed(2)}`;
    }

    function changeQty(idx, delta) {
        cart[idx].qty += delta;
        if(cart[idx].qty <= 0) cart.splice(idx, 1);
        renderCart();
        updateUI();
    }

    // --- FINALIZAR ---
    document.getElementById('cust-payment').addEventListener('change', function() {
        const trocoArea = document.getElementById('troco-area');
        if(this.value === 'Dinheiro') trocoArea.classList.remove('hidden');
        else trocoArea.classList.add('hidden');
    });

    function finishOrder() {
        const name = document.getElementById('cust-name').value;
        const street = document.getElementById('cust-street').value;
        const number = document.getElementById('cust-number').value;
        const district = document.getElementById('cust-district').value;
        const ref = document.getElementById('cust-ref').value; // Obs Entrega
        const orderObs = document.getElementById('order-obs').value; // Obs Comida
        const payment = document.getElementById('cust-payment').value;
        const troco = document.getElementById('cust-troco').value;

        if(!name || !street || !number || !district || !payment) {
            alert("Preencha Nome, Endereço e Forma de Pagamento!");
            return;
        }

        let itensMsg = cart.map(i => `• ${i.qty}x ${i.name}`).join('%0A');
        let total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0).toFixed(2);
        
        let msg = `*🍔 NOVO PEDIDO - BURGER BOSS*%0A%0A`;
        msg += `*Cliente:* ${name}%0A`;
        
        // Itens e Obs de Comida
        msg += `%0A*🛒 PEDIDO:*%0A${itensMsg}%0A`;
        if(orderObs) msg += `*📝 Obs Cozinha:* ${orderObs}%0A`;
        msg += `*💰 Total:* R$ ${total}%0A%0A`;
        
        // Entrega
        msg += `*📍 ENTREGA:*%0A${street}, ${number} - ${district}%0A`;
        if(ref) msg += `*🛵 Obs Entrega:* ${ref}%0A`;
        
        // Pagamento
        msg += `%0A*💳 Pagamento:* ${payment}`;
        if(payment === 'Dinheiro' && troco) msg += ` (Troco p/ ${troco})`;

        const phone = "5500000000000"; // SEU NÚMERO AQUI
        window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
    }

    // Inicializa
    renderCatalog();
</script>

</body>
</html>
